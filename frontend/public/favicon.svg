<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Emerald Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Document Card Base -->
  <rect x="14" y="10" width="36" height="44" rx="5" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />

  <!-- Document Content Lines -->
  <!-- Top brand pill -->
  <rect x="19" y="15" width="10" height="3" rx="1.5" fill="#34d399" />
  <!-- Line 1 -->
  <rect x="19" y="21" width="26" height="2" rx="1" fill="#64748b" />
  <!-- Line 2 -->
  <rect x="19" y="25" width="18" height="2" rx="1" fill="#475569" />

  <!-- Dynamic Pulse / Wave Line (ATS Scanner heartbeat) -->
  <path d="M 8 38 L 19 38 L 24 41 L 30 26 L 36 46 L 41 35 L 45 38 L 56 38" 
        stroke="#10b981" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.3" />
        
  <path d="M 8 38 L 19 38 L 24 41 L 30 26 L 36 46 L 41 35 L 45 38 L 56 38" 
        stroke="url(#pulseGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- High point glow dot -->
  <circle cx="30" cy="26" r="2" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Bottom Resume Line -->
  <rect x="19" y="47" width="26" height="2" rx="1" fill="#334155" />
</svg>
